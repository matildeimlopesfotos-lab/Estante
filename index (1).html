<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A minha estante</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Estante">
<meta name="theme-color" content="#8a3b1f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{--bg:#f6f1e7;--fg:#2b2118;--mut:#7a6a58;--card:#fffaf0;--wood:#b07a45;--wood2:#8a5a2e;--acc:#8a3b1f;--bd:#e1d5c0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1813;--fg:#f0e6d6;--mut:#a89884;--card:#2a231c;--wood:#7a5230;--wood2:#563819;--acc:#e0a070;--bd:#3d3328;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1813;--fg:#f0e6d6;--mut:#a89884;--card:#2a231c;--wood:#7a5230;--wood2:#563819;--acc:#e0a070;--bd:#3d3328;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif;padding:16px;max-width:900px;margin-inline:auto}
h1{font-size:24px;margin:4px 0 12px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab,.btn{font:inherit;font-size:15px;border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:9px 14px;border-radius:10px;cursor:pointer}
.tab.on,.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.tab.on{color:#fff}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.bar input{flex:1;min-width:140px}
input,select,textarea{font:inherit;font-size:15px;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);width:100%}
.col h2{font-size:16px;margin:18px 0 6px;color:var(--mut);font-weight:normal;letter-spacing:.5px}
.shelf{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:14px 10px 0;background:linear-gradient(var(--wood2),var(--wood));border-radius:6px 6px 0 0;box-shadow:inset 0 6px 10px rgba(0,0,0,.35);min-height:150px;align-items:end}
.cl{grid-column:1/-1;font-size:11px;font-style:italic;letter-spacing:.3px;color:rgba(255,255,255,.6);margin:4px 0 -2px;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.tabs{flex-wrap:wrap}
.tab{padding:9px 12px}
dialog .dcov{margin:2px 0 12px}
.dcov img{display:block;max-width:100%;max-height:52vh;margin:0 auto;border-radius:4px 8px 8px 4px;box-shadow:3px 4px 14px rgba(0,0,0,.45)}
.dcov .ph{width:150px;height:225px;margin:0 auto;border-radius:4px 8px 8px 4px;padding:10px;font-size:14px;text-align:center;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(135deg,#6b4a3a,#3d2a22);color:#f3e6d0}
.dtt{font-size:21px;margin:4px 0 2px;text-align:center}
.dau{text-align:center;color:var(--mut);font-size:15px}
.dco{text-align:center;color:var(--mut);font-size:13px;font-style:italic;margin-top:2px}
.dst{text-align:center;font-size:13px;color:var(--mut);margin-top:10px}
.dnt{text-align:center;font-size:24px;letter-spacing:2px;color:#d9a21b;margin-top:6px}
.dmeta{text-align:center;font-size:13px;color:var(--mut);margin-top:4px}
.dcm{margin-top:14px;padding:12px;background:var(--card);border:1px solid var(--bd);border-radius:10px;font-size:15px;line-height:1.45;white-space:pre-wrap}
.when{display:flex;gap:8px}
.plank{height:14px;background:var(--wood2);border-radius:0 0 6px 6px;box-shadow:0 6px 8px rgba(0,0,0,.25)}
.book{width:100%;aspect-ratio:2/3;height:auto;border-radius:3px 6px 6px 3px;background:var(--card);box-shadow:3px 3px 8px rgba(0,0,0,.45);cursor:pointer;overflow:hidden;position:relative;margin-bottom:-1px;transition:transform .15s}
.book:active{transform:translateY(-6px)}
.book img{width:100%;height:100%;object-fit:cover;display:block}
.book .ph{padding:8px 6px;font-size:11px;line-height:1.25;text-align:center;display:flex;flex-direction:column;justify-content:center;height:100%;background:linear-gradient(135deg,#6b4a3a,#3d2a22);color:#f3e6d0}
.empty{color:var(--mut);text-align:center;padding:40px 10px}
dialog{max-height:90vh;overflow:auto;border:1px solid var(--bd);border-radius:14px;background:var(--bg);color:var(--fg);width:min(92vw,400px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.prev{width:70px;height:105px;object-fit:cover;border-radius:4px;margin-top:8px;display:none}
.cvst{font-size:13px;color:var(--mut);margin-top:6px;min-height:1.2em}
#f-b{width:100%}
.nt{position:absolute;bottom:2px;right:4px;font-style:normal;font-size:11px;color:#f5c542;font-weight:bold;text-shadow:0 1px 3px #000}
.fm{position:absolute;bottom:2px;left:3px;font-style:normal;font-size:13px;text-shadow:0 1px 3px #000}
.st{position:absolute;top:2px;right:4px;color:#f5c542;font-style:normal;font-size:16px;text-shadow:0 1px 3px #000}
.foot{margin-top:28px;font-size:13px;color:var(--mut);display:flex;gap:8px;flex-wrap:wrap}
.pg{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:2px 0 6px}
.pg>i{display:block;height:100%;background:var(--acc);border-radius:6px}
.srow{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 0}
.srow b{min-width:56px;font-weight:normal}
.srow .pg{flex:1;margin:0}
.srow span{min-width:22px;text-align:right;color:var(--mut)}
.sbig{font-size:15px;margin:6px 0}
#sdlg h3{font-size:14px;color:var(--mut);font-weight:normal;letter-spacing:.5px;margin:16px 0 4px}
.bk{display:none;background:var(--card);border:1px solid var(--acc);border-radius:10px;padding:10px 12px;margin:0 0 14px;font-size:14px;line-height:1.4}
.bk .row{display:flex;gap:8px;flex-wrap:wrap}

.sbar{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;font-size:14px;color:var(--mut)}
.bs{background:var(--sback);border-radius:10px;padding:8px 8px 16px;box-shadow:inset 0 0 26px rgba(0,0,0,.4)}
.gname{display:inline-block;margin:12px 0 4px 4px;padding:3px 12px;border-radius:6px;background:var(--slab);color:var(--slabt);font-size:12px;letter-spacing:1px;box-shadow:0 2px 4px rgba(0,0,0,.35)}
.shr{margin-top:2px}
.sitems{display:flex;align-items:flex-end;min-height:158px;padding:0 2px}
.plank2{height:14px;background:linear-gradient(var(--pl1),var(--pl2));border-radius:2px;box-shadow:0 8px 10px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.18)}
.spine{position:relative;flex:none;margin:0 1px;border-radius:2px 2px 1px 1px;box-shadow:inset -3px 0 4px rgba(0,0,0,.3),inset 2px 0 2px rgba(255,255,255,.14),1px 0 2px rgba(0,0,0,.45);overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center}
.spine::before,.spine::after{content:'';position:absolute;left:0;right:0;height:3px;background:var(--sb,rgba(255,255,255,.3))}
.spine::before{top:8px}.spine::after{bottom:8px}
.spine span{writing-mode:vertical-rl;font-size:10px;line-height:1.1;max-height:84%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:Georgia,serif;font-weight:bold;letter-spacing:.2px}
.spine i{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-style:normal;font-size:9px;color:#f5c542;text-shadow:0 1px 2px #000}
.spine.now{transform:rotate(-9deg);transform-origin:bottom left;margin-right:14px;filter:drop-shadow(0 0 3px rgba(245,197,66,.7))}
.spine.dim{opacity:.2}
.deco{position:relative;flex:none;margin:0 2px;pointer-events:auto}
.deco svg{display:block}
.dx{position:absolute;top:-6px;right:-6px;background:#c0392b;color:#fff;border-radius:50%;width:18px;height:18px;font:13px/18px sans-serif;text-align:center;text-decoration:none;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.sed{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:10px;font-size:13px;color:var(--mut);line-height:1.4}
.slab{margin:8px 0 6px}.slab:first-child{margin-top:0}
.chips,.pal{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);padding:6px 10px;border-radius:16px;cursor:pointer}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.pbtn{width:58px;height:66px;border:2px solid var(--bd);border-radius:10px;background:var(--bg);padding:4px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.pbtn.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.pbtn svg{max-width:100%;max-height:100%}
.sedit-on .spine{cursor:copy}
</style>
</head>
<body>
<h1>📚 A minha estante</h1>
<div class="bk" id="bkbar"></div>
<div class="tabs">
  <button class="tab on" data-t="shelf">🪵 Estante</button>
  <button class="tab" data-t="read">Lidos <span id="nr"></span></button>
  <button class="tab" data-t="now">A ler <span id="nn"></span></button>
  <button class="tab" data-t="wish">Desejos <span id="nw"></span></button>
  <button class="btn" id="stbtn">📊 Estatísticas</button>
</div>
<div class="bar">
  <input id="q" type="search" placeholder="Pesquisar título ou autor…">
  <select id="grp" style="width:auto"><option value="col">Por coleção</option><option value="aut">Por autor</option><option value="ano">Por ano de leitura</option><option value="fmt">Por formato</option><option value="gen" selected>Por género</option></select>
  <button class="btn pri" id="add">+ Livro</button>
</div>
<div id="view"></div>
<div class="foot">
  <button class="btn" id="miss">🔍 Procurar capas em falta</button>
  <span id="miss-st" style="flex-basis:100%"></span>
  <button class="btn" id="exp">Exportar cópia</button>
  <button class="btn" id="imp">Importar cópia</button>
  <button class="btn" id="shr">Partilhar cópia</button>
  <input type="file" id="impf" accept=".json" hidden>
  <span id="bk-st" style="flex-basis:100%;font-size:13px;color:var(--mut)"></span>
  <label style="flex-basis:100%;font-size:13px;color:var(--mut)">Lembrar-me de fazer cópia: <select id="bk-ev" style="width:auto"><option value="7">todas as semanas</option><option value="14">de 2 em 2 semanas</option><option value="30">todos os meses</option><option value="0">nunca</option></select></label>
</div>

<dialog id="dlg">
  <div id="dt" style="font-size:18px;font-weight:bold">Novo livro</div>
  <label>Título</label><input id="f-t">
  <label>Autor</label><input id="f-a">
  <label>Coleção</label><input id="f-c" list="cols" placeholder="ex.: Ficção, Arquitetura…"><datalist id="cols"></datalist>
  <label>Total de livros na coleção (opcional)</label><input id="f-ct" type="number" inputmode="numeric" min="1" max="99" placeholder="ex.: 5, para ver “3 de 5”">
  <label>Estado</label>
  <select id="f-s"><option value="read">Lido</option><option value="now">A ler</option><option value="wish">Quero ler</option></select>
  <label>Género</label><input id="f-g" list="gens" placeholder="ex.: Romance, Ensaio, Ficção científica…"><datalist id="gens"></datalist>
  <label>Nota</label><select id="f-n"><option value="">Sem nota</option><option value="1">★ 1</option><option value="2">★★ 2</option><option value="3">★★★ 3</option><option value="4">★★★★ 4</option><option value="5">★★★★★ 5</option></select>
  <label>Comentário</label><textarea id="f-o" rows="3" style="width:100%" placeholder="O que achou do livro?"></textarea>
  <label>Formato</label><select id="f-m"><option value="f">📖 Físico</option><option value="v">📱 Virtual</option></select>
  <label>Ano em que leu</label><div class="when"><input id="f-y" type="number" inputmode="numeric" min="1900" max="2100" placeholder="Ano, ex.: 2026"></div>
  <label style="display:flex;align-items:center;gap:8px;color:var(--fg);font-size:15px"><input id="f-v" type="checkbox" style="width:auto"> ★ Favorito</label>
  <label>Capa</label><button class="btn" id="f-b" type="button">🔍 Procurar capa</button><div class="cvst" id="cv-st"></div>
  <label>ou carregar uma foto</label><input type="file" id="f-f" accept="image/*">
  <img class="prev" id="prev" alt="">
  <div class="row">
    <button class="btn pri" id="save">Guardar</button>
    <button class="btn" id="cancel">Cancelar</button>
    <button class="btn" id="del" style="margin-left:auto;color:#c0392b">Apagar</button>
  </div>
</dialog>
<dialog id="det"><div id="detb"></div></dialog>
<dialog id="sdlg"><div id="sdb"></div></dialog>

<script>
var LS=(function(){try{var t=window.localStorage;t.setItem('_t','1');t.removeItem('_t');return t}catch(e){var m={};return{getItem:function(k){return k in m?m[k]:null},setItem:function(k,v){m[k]=String(v)},removeItem:function(k){delete m[k]}}}})();

var INIT=[];
var INIT_CT={"Twisted": 4, "The Selection": 5, "A Rapariga do Calendário": 4, "Nunca Jamais": 3, "Métrica": 3, "Cinquenta Sombras": 3, "O Homem do Mês": 4, "Culpados": 3, "Crossfire": 5};
try{if(!LS.getItem('estante-v1')){LS.setItem('estante-v1',JSON.stringify(INIT));LS.setItem('estante-v1-coltot',JSON.stringify(INIT_CT));["seed1", "seed10", "seed11", "seed12", "seed13", "seed14", "seed15", "seed16", "seed17", "seed18", "seed2", "seed20", "seed21", "seed22", "seed23", "seed24", "seed25", "seed26", "seed3", "seed4", "seed5", "seed6", "seed7", "seed8", "seed9"].forEach(function(n){LS.setItem('estante-v1-'+n,'1')})}}catch(e){}
var KEY='estante-v1', books=[], tab='shelf', editId=null, cover='', detId=null;
var MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
try{books=JSON.parse(LS.getItem(KEY)||'[]')}catch(e){books=[]}
function persist(){try{LS.setItem(KEY,JSON.stringify(books))}catch(e){alert('Sem espaço para guardar. Exporte uma cópia e use capas mais pequenas.')}}
var SEED=null;
try{if(!LS.getItem(KEY+'-seed1')){SEED.forEach(function(x){if(!books.some(function(b){return b.id===x.id})){x.s='read';x.m='f';books.push(x)}});persist();LS.setItem(KEY+'-seed1','1')}}catch(e){}
var SEED2=null;
try{if(!LS.getItem(KEY+'-seed2')){SEED2.forEach(function(x){if(!books.some(function(b){return b.id===x.id})){x.s='wish';x.m='f';books.push(x)}});persist();LS.setItem(KEY+'-seed2','1')}}catch(e){}
var SEED3=null;
try{if(!LS.getItem(KEY+'-seed3')){SEED3.forEach(function(x){if(!books.some(function(b){return b.id===x.id})){x.s='read';x.m='f';books.push(x)}});persist();LS.setItem(KEY+'-seed3','1')}}catch(e){}
var SEED4=null;
try{if(!LS.getItem(KEY+'-seed4')){SEED4.forEach(function(x){var e=books.find(function(b){return b.id===x.id});if(e){e.img=x.img;e.c=x.c}else{x.s='read';x.m='f';books.push(x)}});persist();LS.setItem(KEY+'-seed4','1')}}catch(e){}
var SEED5=null;
try{if(!LS.getItem(KEY+'-seed5')){SEED5.forEach(function(x){if(!books.some(function(b){return b.id===x.id})){x.s='read';x.m='f';books.push(x)}});persist();LS.setItem(KEY+'-seed5','1')}}catch(e){}
try{if(!LS.getItem(KEY+'-seed6')){var MG={lidoc1:3,lidoc2:3,lidoc3:3,lidoc4:3,lidok1:8,lidok2:8,lidok3:8};books.forEach(function(b){if(MG[b.id]&&!b.mo)b.mo=String(MG[b.id])});persist();LS.setItem(KEY+'-seed6','1')}}catch(e){}
var SEED7=null;
try{if(!LS.getItem(KEY+'-seed7')){SEED7.forEach(function(x){if(!books.some(function(b){return b.id===x.id})){x.s='read';x.m='f';books.push(x)}});persist();LS.setItem(KEY+'-seed7','1')}}catch(e){}
var COV8=null;
try{if(!LS.getItem(KEY+'-seed8')){books.forEach(function(b){if(COV8[b.id]){b.img=COV8[b.id];if(b.id==='est7_26'&&!b.c)b.c='Culpados'}});persist();LS.setItem(KEY+'-seed8','1')}}catch(e){}
var SEED9=null;
try{if(!LS.getItem(KEY+'-seed9')){SEED9.forEach(function(x){if(!books.some(function(b){return b.id===x.id})){x.s='read';x.m='f';books.push(x)}});persist();LS.setItem(KEY+'-seed9','1')}}catch(e){}
var SEED10=null;
try{if(!LS.getItem(KEY+'-seed10')){SEED10.forEach(function(x){if(!books.some(function(b){return b.id===x.id})){x.s='read';x.m='f';books.push(x)}});persist();LS.setItem(KEY+'-seed10','1')}}catch(e){}
var COV11=null;
try{if(!LS.getItem(KEY+'-seed11')){books.forEach(function(b){if(COV11[b.id])b.img=COV11[b.id]});persist();LS.setItem(KEY+'-seed11','1')}}catch(e){}
var SEED12=null;
try{if(!LS.getItem(KEY+'-seed12')){SEED12.forEach(function(x){if(!books.some(function(b){return b.id===x.id})){x.s='read';x.m='f';books.push(x)}});books.forEach(function(b){var u=UPD12[b.id];if(u){b.img=u.img;if(u.c&&!b.c)b.c=u.c}});persist();LS.setItem(KEY+'-seed12','1')}}catch(e){}
var SEED13=null;
try{if(!LS.getItem(KEY+'-seed13')){SEED13.forEach(function(x){if(!books.some(function(b){return b.id===x.id})){x.s='wish';x.m='f';books.push(x)}});persist();LS.setItem(KEY+'-seed13','1')}}catch(e){}
var SEED14=null;
try{if(!LS.getItem(KEY+'-seed14')){SEED14.forEach(function(x){if(!books.some(function(b){return b.id===x.id})){x.s='wish';x.m='f';books.push(x)}});books.forEach(function(b){if(UPD14[b.id])b.img=UPD14[b.id]});persist();LS.setItem(KEY+'-seed14','1')}}catch(e){}
var COV15=null;
try{if(!LS.getItem(KEY+'-seed15')){books.forEach(function(b){if(COV15[b.id]&&!b.img)b.img=COV15[b.id]});persist();LS.setItem(KEY+'-seed15','1')}}catch(e){}
var SEED16=null;
try{if(!LS.getItem(KEY+'-seed16')){SEED16.forEach(function(x){if(!books.some(function(b){return b.id===x.id})){x.s='read';x.m='f';books.push(x)}});persist();LS.setItem(KEY+'-seed16','1')}}catch(e){}
var COV17=null;
try{if(!LS.getItem(KEY+'-seed17')){books.forEach(function(b){if(COV17[b.id]&&!b.img)b.img=COV17[b.id]});persist();LS.setItem(KEY+'-seed17','1')}}catch(e){}
var COLTOT={};try{COLTOT=JSON.parse(LS.getItem(KEY+'-coltot')||'{}')||{}}catch(e){COLTOT={}}
function saveCT(){try{LS.setItem(KEY+'-coltot',JSON.stringify(COLTOT))}catch(e){}}
var META={};try{META=JSON.parse(LS.getItem(KEY+'-meta')||'{}')||{}}catch(e){META={}}
function saveMeta(){try{LS.setItem(KEY+'-meta',JSON.stringify(META))}catch(e){}}
var SMALL={a:1,o:1,as:1,os:1,um:1,uma:1,de:1,da:1,do:1,das:1,dos:1,e:1,em:1,no:1,na:1,nos:1,nas:1,que:1,com:1,para:1,por:1,ou:1,ao:1,aos:1,'à':1,'às':1};
function tidyT(t){
  var start=true;
  return String(t).split(' ').map(function(w){
    var key=w.split('-')[0].toLowerCase(),out=w;
    if(w&&/^[a-zà-ÿ]/.test(w)&&(start||!SMALL[key]))out=w.charAt(0).toUpperCase()+w.slice(1);
    start=/[:–\/]$/.test(w)||w==='–'||w==='/';
    return out}).join(' ');
}
try{if(!LS.getItem(KEY+'-seed18')){
  var STARK={lidok1:1,lidok2:1,lidok3:1,lidok4:1,lidok5:1,lidok6:1,lidok7:1,est7_33:1,est7_34:1};
  var PESS={est7_10:1,est9_01:1,est10_01:1,est16_01:1,est16_02:1};
  var own={};books.forEach(function(b){if(b.c&&b.c===b.a)own[b.a]=1});
  var cnt={};books.forEach(function(b){if(!b.c&&b.a)cnt[b.a]=(cnt[b.a]||0)+1});
  books.forEach(function(b){
    if(STARK[b.id]||b.c==='Série Stark')b.c='Stark';

var PAL=[[181,82,59],[47,111,115],[217,164,65],[122,79,143],[60,122,78],[194,107,122],[52,73,94],[140,98,57],[96,111,163],[170,120,60]];
function hsh(x){var h=7;for(var i=0;i<x.length;i++)h=(h*31+x.charCodeAt(i))>>>0;return h}
function decoSvg(k){var d=DECOS[k];return '<svg viewBox="0 0 '+d.w+' '+d.h+'" width="'+d.w+'" height="'+d.h+'" xmlns="http://www.w3.org/2000/svg">'+d.svg+'</svg>'}
function rgb(c,f){return 'rgb('+Math.round(c[0]*f)+','+Math.round(c[1]*f)+','+Math.round(c[2]*f)+')'}
function spineBg(c){return 'linear-gradient(90deg,'+rgb(c,.82)+','+rgb(c,1.05)+' 45%,'+rgb(c,.78)+')'}
function lum(c){var f=c.map(function(v){v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*f[0]+.7152*f[1]+.0722*f[2]}
function spineFg(c){var L=lum(c);return (L+.05)/(0.02+.05)>(1.05)/(L+.05)?'#2b2118':'#fbf3e4'}
function paintSpine(el,c){el.style.background=spineBg(c);el.style.color=spineFg(c);el.style.setProperty('--sb',spineFg(c)==='#2b2118'?'rgba(0,0,0,.28)':'rgba(255,255,255,.32)')}
function domColor(im){
  var cv=document.createElement('canvas');cv.width=12;cv.height=18;var x=cv.getContext('2d');x.drawImage(im,0,0,12,18);
  var d=x.getImageData(0,0,12,18).data,bk={},best=null;
  for(var i=0;i<d.length;i+=4){var r=d[i],g=d[i+1],b=d[i+2];if(r>236&&g>236&&b>236)continue;var k=(r>>5)+','+(g>>5)+','+(b>>5),o=bk[k]||(bk[k]={n:0,r:0,g:0,b:0});o.n++;o.r+=r;o.g+=g;o.b+=b;if(!best||o.n>best.n)best=o}
  return best?[best.r/best.n,best.g/best.n,best.b/best.n]:[140,98,57];
}
function colorize(){
  var byId={};books.forEach(function(b){byId[b.id]=b});
  document.querySelectorAll('.spine').forEach(function(el){
    var b=byId[el.dataset.id];if(!b||!b.img)return;
    if(SC[b.id]){paintSpine(el,SC[b.id]);return}
    var im=new Image();im.onload=function(){try{SC[b.id]=domColor(im);if(el.isConnected)paintSpine(el,SC[b.id])}catch(e){}};im.src=b.img;
  });
}
function renderShelf(){
  var q=$('q').value.toLowerCase(),th=THEMES[SHL.theme]||THEMES.escura;
  var list=books.filter(function(b){return b.s==='read'||b.s==='now'});
  var groups={};list.forEach(function(b,i){b._i=i;(groups[b.g||'Sem género']=groups[b.g||'Sem género']||[]).push(b)});
  Object.keys(groups).forEach(function(n){var L=groups[n],fi={};L.forEach(function(x,i){x._i=i;if(!(x.a in fi))fi[x.a]=i});L.sort(function(x,y){var dx=fi[x.a],dy=fi[y.a];return dx===dy?x._i-y._i:dx-dy})});
  var names=Object.keys(groups).sort(function(a,b){if(a==='Sem género')return 1;if(b==='Sem género')return -1;var ia=GORD.indexOf(a),ib=GORD.indexOf(b);if(ia<0)ia=99;if(ib<0)ib=99;return ia===ib?a.localeCompare(b):ia-ib});
  var W=Math.max(220,($('view').clientWidth||window.innerWidth-32)-28);
  var h='<div class="sbar"><span>'+list.length+' livros na estante</span><button class="btn'+(SEDIT?' pri':'')+'" id="sedit">'+(SEDIT?'✔ Concluído':'✏️ Editar estante')+'</button></div>';
  if(SEDIT){
    h+='<div class="sed"><div class="slab">Cor da estante</div><div class="chips">'+Object.keys(THEMES).map(function(k){return '<button class="chip'+(SHL.theme===k?' on':'')+'" data-th="'+k+'">'+THEMES[k].n+'</button>'}).join('')+'</div>';
    h+='<div class="slab">Decorações: escolhe uma e toca num livro (ou no nome de uma categoria) para a pôr. Toca numa decoração para a tirar.</div><div class="pal">'+Object.keys(DECOS).map(function(k){return '<button class="pbtn'+(SSEL===k?' on':'')+'" data-dt="'+k+'" title="'+DECOS[k].n+'">'+decoSvg(k)+'</button>'}).join('')+'</div></div>';
  }
  h+='<div class="bs'+(SEDIT?' sedit-on':'')+'" style="--sback:'+th.back+';--pl1:'+th.pl1+';--pl2:'+th.pl2+';--slab:'+th.lab+';--slabt:'+th.labt+'">';
  names.forEach(function(n){
    h+='<div class="gname" data-g="'+esc(n)+'">'+esc(n.toUpperCase())+' · '+groups[n].length+'</div>';
    var seq=[];
    DECO.filter(function(d){return d.after==='g:'+n&&DECOS[d.t]}).forEach(function(d){seq.push({d:d})});
    groups[n].forEach(function(b){seq.push({b:b});DECO.filter(function(d){return d.after===b.id&&DECOS[d.t]}).forEach(function(d){seq.push({d:d})})});
    var rows=[],cur='',cw=0;
    seq.forEach(function(it){
      var html,w;
      if(it.b){
        var b=it.b,hs=hsh(b.id),sw=24+(hs%9)+(b.t.length>24?5:0),sh=112+((hs>>3)%38),c=SC[b.id]||PAL[hs%PAL.length];
        var match=!q||(b.t+' '+b.a).toLowerCase().indexOf(q)>-1;
        w=sw+2+(b.s==='now'?14:0);
        html='<div class="spine'+(b.s==='now'?' now':'')+(match?'':' dim')+'" data-id="'+b.id+'" title="'+esc(b.t)+' — '+esc(b.a)+'" style="width:'+sw+'px;height:'+sh+'px;background:'+spineBg(c)+';color:'+spineFg(c)+';--sb:'+(spineFg(c)==='#2b2118'?'rgba(0,0,0,.28)':'rgba(255,255,255,.32)')+'"><span>'+esc(b.t)+'</span>'+(b.f?'<i>★</i>':'')+'</div>';
      }else{
        var D=DECOS[it.d.t];w=D.w+4;
        html='<div class="deco" data-did="'+it.d.id+'" style="width:'+D.w+'px;height:'+D.h+'px">'+decoSvg(it.d.t)+(SEDIT?'<u class="dx">×</u>':'')+'</div>';
      }
      if(cw+w>W&&cur){rows.push(cur);cur='';cw=0}
      cur+=html;cw+=w;
    });
    if(cur)rows.push(cur);
    rows.forEach(function(r){h+='<div class="shr"><div class="sitems">'+r+'</div><div class="plank2"></div></div>'});
  });
  h+='</div>';
  $('view').innerHTML=list.length?h:'<div class="empty">Ainda não há livros na estante. Toque em “+ Livro”.</div>';
  colorize();
}
function shelfClick(e){
  var t=e.target;
  if(t.closest('#sedit')){SEDIT=!SEDIT;SSEL='';render();return}
  var th=t.closest('[data-th]');if(th){SHL.theme=th.dataset.th;saveShl();render();return}
  var pb=t.closest('[data-dt]');if(pb){SSEL=(SSEL===pb.dataset.dt?'':pb.dataset.dt);render();return}
  var dc=t.closest('.deco');
  if(dc){if(SEDIT){DECO=DECO.filter(function(d){return d.id!==dc.dataset.did});saveDeco();render()}return}
  var sp=t.closest('.spine');
  if(sp){
    if(SEDIT&&SSEL){DECO.push({id:'d'+Date.now().toString(36)+Math.floor(Math.random()*1e4),t:SSEL,after:sp.dataset.id});saveDeco();render();return}
    openDet(sp.dataset.id);return;
  }
  var gn=t.closest('.gname');
  if(gn&&SEDIT&&SSEL){DECO.push({id:'d'+Date.now().toString(36)+Math.floor(Math.random()*1e4),t:SSEL,after:'g:'+gn.dataset.g});saveDeco();render()}
}

var BK={last:0,every:7,snooze:0};

function bkData(){return JSON.stringify({books:books,coltot:COLTOT,meta:META,deco:DECO,shelf:SHL})}
function bkName(){var d=new Date();return 'estante-'+d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)+'.json'}
function bkRefresh(){
  var bar=$('bkbar'),now=Date.now(),days=BK.last?Math.floor((now-BK.last)/864e5):0;
  $('bk-ev').value=String(BK.every);
  $('bk-st').textContent=BK.last?'Última cópia: '+new Date(BK.last).toLocaleDateString('pt-PT')+' (há '+days+(days===1?' dia':' dias')+')':'Ainda não fizeste nenhuma cópia.';
  var due=books.length>0&&BK.every>0&&now>BK.snooze&&(!BK.last||days>=BK.every);
  if(due){bar.style.display='block';bar.innerHTML='💾 '+(BK.last?'Já passaram '+days+(days===1?' dia':' dias')+' desde a última cópia de segurança.':'Ainda não fizeste nenhuma cópia de segurança.')+'<div class="row" style="margin-top:8px"><button class="btn pri" data-a="bk">Fazer cópia agora</button><button class="btn" data-a="later">Mais tarde</button></div>'}
  else bar.style.display='none';
}
function bkDone(){BK.last=Date.now();BK.snooze=0;saveBK();bkRefresh()}
async function bkDownload(){
  var data=bkData(),name=bkName();
  try{if(window.claude&&claude.use){var dl=await claude.use('downloads');if(dl){await dl.save({filename:name,data:data});bkDone();return}}}catch(e){if(e&&e.code==='declined')return}
  var u=URL.createObjectURL(new Blob([data],{type:'application/json'}));
  var a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(u)},4000);bkDone();
}
async function bkShare(){
  var name=bkName(),data=bkData(),types=['application/json','text/plain'];
  for(var k=0;k<types.length;k++){
    var f=new File([data],name,{type:types[k]});
    try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Cópia da estante'});bkDone();return}}catch(e){if(e&&e.name==='AbortError')return}
  }
  bkDownload();
}

};
